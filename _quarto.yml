format:
  html:
    theme: cosmo
    css:
      - styles.css
      - assets/modern.css
    include-after-body: scripts/navigation.html
    lang: it
    toc: true
    toc-title: In questa pagina
    code-copy: true
    link-external-newwindow: true
    html-math-method: mathjax
    smooth-scroll: true
