<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 535" role="img"><title>MOSFET a canale N come interruttore</title><rect width="720" height="535" rx="12" fill="white"/><g fill="#16324f" font-family="Arial,sans-serif"><text x="24" y="30" font-size="22" text-anchor="start">MOSFET a canale N come interruttore</text><path d="M450 65v20 M450 145v20" fill="none" stroke="#16324f" stroke-width="2.4"/><rect x="440" y="85" width="20" height="60" fill="#eff8f8" stroke="#007f86" stroke-width="2"/><text x="450" y="121" font-size="18" text-anchor="middle"></text><text x="470" y="120" font-size="18" text-anchor="start">Carico resistivo</text><path d="M450 45V65 M450 165V195H410 M410 195V290 M410 280H450V345 M380 195V290 M40 240H80 M180 240H380 M220 240V280 M220 380H450 M450 345V380 M450 380V400" fill="none" stroke="#16324f" stroke-width="2.4"/><path d="M80 240h20 M160 240h20" fill="none" stroke="#16324f" stroke-width="2.4"/><rect x="100" y="230" width="60" height="20" fill="#eff8f8" stroke="#007f86" stroke-width="2"/><text x="130" y="246" font-size="18" text-anchor="middle"></text><text x="130" y="217" font-size="17" text-anchor="middle">RG</text><circle cx="220" cy="240" r="4" fill="#16324f"/><path d="M220 280v20 M220 360v20" fill="none" stroke="#16324f" stroke-width="2.4"/><rect x="210" y="300" width="20" height="60" fill="#eff8f8" stroke="#007f86" stroke-width="2"/><text x="220" y="336" font-size="18" text-anchor="middle"></text><text x="240" y="335" font-size="18" text-anchor="start">RGS</text><text x="460" y="55" font-size="18" text-anchor="start">+V</text><text x="460" y="205" font-size="18" text-anchor="start">D</text><text x="350" y="235" font-size="18" text-anchor="start">G</text><text x="460" y="300" font-size="18" text-anchor="start">S / body</text><text x="24" y="280" font-size="18" text-anchor="start">Comando</text><text x="470" y="385" font-size="18" text-anchor="start">0 V comune</text><text x="24" y="445" font-size="18" text-anchor="start">RGS mantiene spento il MOSFET quando il comando è scollegato.</text><text x="24" y="475" font-size="18" text-anchor="start">Simbolo semplificato: body collegato a S; diodo interno non rappresentato.</text><text x="24" y="505" font-size="18" text-anchor="start">Scegliere il dispositivo per la VGS disponibile, non solo per VGS(th).</text></g></svg>