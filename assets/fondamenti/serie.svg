<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img"><title>Due resistori in serie</title><rect width="720" height="420" rx="12" fill="white"/><g fill="#16324f" font-family="Arial,sans-serif"><text x="24" y="30" font-size="22" text-anchor="start">Due resistori in serie</text><path d="M130 150v40 M130 250v40" fill="none" stroke="#16324f" stroke-width="2.4"/><circle cx="130" cy="220" r="30" fill="white" stroke="#16324f" stroke-width="2.4"/><text x="130" y="215" font-size="21" text-anchor="middle">+</text><text x="130" y="239" font-size="21" text-anchor="middle">−</text><text x="88" y="220" font-size="17" text-anchor="end">6 V</text><path d="M130 150V100H220 M320 100H420 M520 100H590V340H130V290" fill="none" stroke="#16324f" stroke-width="2.4"/><path d="M220 100h20 M300 100h20" fill="none" stroke="#16324f" stroke-width="2.4"/><rect x="240" y="90" width="60" height="20" fill="#eff8f8" stroke="#007f86" stroke-width="2"/><text x="270" y="106" font-size="18" text-anchor="middle"></text><text x="270" y="77" font-size="17" text-anchor="middle">R1 = 1 kΩ</text><path d="M420 100h20 M500 100h20" fill="none" stroke="#16324f" stroke-width="2.4"/><rect x="440" y="90" width="60" height="20" fill="#eff8f8" stroke="#007f86" stroke-width="2"/><text x="470" y="106" font-size="18" text-anchor="middle"></text><text x="470" y="77" font-size="17" text-anchor="middle">R2 = 2 kΩ</text><text x="270" y="190" font-size="18" text-anchor="start">I = 2 mA in entrambi</text><text x="270" y="240" font-size="18" text-anchor="start">V1 = 2 V; V2 = 4 V</text><text x="270" y="290" font-size="18" text-anchor="start">6 V − 2 V − 4 V = 0</text></g></svg>