<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 485" role="img"><title>Diodo di ricircolo su una bobina in continua</title><rect width="720" height="485" rx="12" fill="white"/><g fill="#16324f" font-family="Arial,sans-serif"><text x="24" y="30" font-size="22" text-anchor="start">Diodo di ricircolo su una bobina in continua</text><path d="M300 110v15 M300 185v15 M300 125a10 10 0 0 1 0 20a10 10 0 0 1 0 20a10 10 0 0 1 0 20" fill="none" stroke="#16324f" stroke-width="2.4"/><text x="325" y="155" font-size="18" text-anchor="start">L</text><path d="M300 65V110 M300 200V270 M300 310V365 M300 85H520V115 M520 195V235H300 M300 270l18 25" fill="none" stroke="#16324f" stroke-width="2.4"/><path d="M520 115v20 M520 175v20" fill="none" stroke="#16324f" stroke-width="2.4"/><path d="M502 175H538L520 135Z M498 135H542" fill="white" stroke="#16324f" stroke-width="2.4"/><text x="550" y="160" font-size="18" text-anchor="start">D</text><circle cx="300" cy="85" r="4" fill="#16324f"/><circle cx="300" cy="235" r="4" fill="#16324f"/><text x="235" y="65" font-size="18" text-anchor="start">+V</text><text x="235" y="380" font-size="18" text-anchor="start">0 V</text><text x="180" y="302" font-size="18" text-anchor="start">Comando</text><text x="550" y="110" font-size="18" text-anchor="start">K</text><text x="550" y="215" font-size="18" text-anchor="start">A</text><text x="24" y="425" font-size="18" text-anchor="start">Allo spegnimento: corrente verso il basso in L e da A a K nel diodo.</text><text x="24" y="455" font-size="18" text-anchor="start">Il diodo è inversamente polarizzato durante l’alimentazione della bobina.</text></g></svg>