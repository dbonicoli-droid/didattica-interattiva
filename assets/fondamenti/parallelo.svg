<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img"><title>Due resistori in parallelo</title><rect width="720" height="420" rx="12" fill="white"/><g fill="#16324f" font-family="Arial,sans-serif"><text x="24" y="30" font-size="22" text-anchor="start">Due resistori in parallelo</text><path d="M130 140v40 M130 240v40" fill="none" stroke="#16324f" stroke-width="2.4"/><circle cx="130" cy="210" r="30" fill="white" stroke="#16324f" stroke-width="2.4"/><text x="130" y="205" font-size="21" text-anchor="middle">+</text><text x="130" y="229" font-size="21" text-anchor="middle">−</text><text x="88" y="210" font-size="17" text-anchor="end">6 V</text><path d="M130 140V90H550V150 M350 90V150 M350 250V330 M550 250V330H130V280" fill="none" stroke="#16324f" stroke-width="2.4"/><path d="M350 150v20 M350 230v20" fill="none" stroke="#16324f" stroke-width="2.4"/><rect x="340" y="170" width="20" height="60" fill="#eff8f8" stroke="#007f86" stroke-width="2"/><text x="350" y="206" font-size="18" text-anchor="middle"></text><text x="370" y="205" font-size="18" text-anchor="start">1 kΩ</text><path d="M550 150v20 M550 230v20" fill="none" stroke="#16324f" stroke-width="2.4"/><rect x="540" y="170" width="20" height="60" fill="#eff8f8" stroke="#007f86" stroke-width="2"/><text x="550" y="206" font-size="18" text-anchor="middle"></text><text x="570" y="205" font-size="18" text-anchor="start">2 kΩ</text><circle cx="350" cy="90" r="4" fill="#16324f"/><circle cx="350" cy="330" r="4" fill="#16324f"/><text x="280" y="120" font-size="18" text-anchor="start">I1 = 6 mA</text><text x="485" y="120" font-size="18" text-anchor="start">I2 = 3 mA</text><text x="170" y="380" font-size="18" text-anchor="start">I = I1 + I2 = 9 mA; stessa tensione: 6 V</text></g></svg>