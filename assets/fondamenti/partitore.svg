<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img"><title>Partitore resistivo: uscita sul resistore R2</title><rect width="720" height="430" rx="12" fill="white"/><g fill="#16324f" font-family="Arial,sans-serif"><text x="24" y="30" font-size="22" text-anchor="start">Partitore resistivo: uscita sul resistore R2</text><path d="M130 130v40 M130 230v40" fill="none" stroke="#16324f" stroke-width="2.4"/><circle cx="130" cy="200" r="30" fill="white" stroke="#16324f" stroke-width="2.4"/><text x="130" y="195" font-size="21" text-anchor="middle">+</text><text x="130" y="219" font-size="21" text-anchor="middle">−</text><text x="88" y="200" font-size="17" text-anchor="end">5 V</text><path d="M130 130V80H420V95 M420 195V235 M420 335V350H130V270" fill="none" stroke="#16324f" stroke-width="2.4"/><path d="M420 95v20 M420 175v20" fill="none" stroke="#16324f" stroke-width="2.4"/><rect x="410" y="115" width="20" height="60" fill="#eff8f8" stroke="#007f86" stroke-width="2"/><text x="420" y="151" font-size="18" text-anchor="middle"></text><text x="440" y="150" font-size="18" text-anchor="start">R1 = 2 kΩ</text><path d="M420 235v20 M420 315v20" fill="none" stroke="#16324f" stroke-width="2.4"/><rect x="410" y="255" width="20" height="60" fill="#eff8f8" stroke="#007f86" stroke-width="2"/><text x="420" y="291" font-size="18" text-anchor="middle"></text><text x="440" y="290" font-size="18" text-anchor="start">R2 = 3 kΩ</text><circle cx="420" cy="215" r="4" fill="#16324f"/><path d="M420 215H580" fill="none" stroke="#16324f" stroke-width="2.4"/><text x="585" y="220" font-size="18" text-anchor="start">Vout = 3 V</text><text x="450" y="375" font-size="18" text-anchor="start">0 V</text><text x="24" y="405" font-size="18" text-anchor="start">Senza carico: la stessa corrente attraversa R1 e R2.</text></g></svg>