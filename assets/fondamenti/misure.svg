<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img"><title>Misurare corrente e tensione</title><rect width="720" height="460" rx="12" fill="white"/><g fill="#16324f" font-family="Arial,sans-serif"><text x="24" y="30" font-size="22" text-anchor="start">Misurare corrente e tensione</text><path d="M130 145v40 M130 245v40" fill="none" stroke="#16324f" stroke-width="2.4"/><circle cx="130" cy="215" r="30" fill="white" stroke="#16324f" stroke-width="2.4"/><text x="130" y="210" font-size="21" text-anchor="middle">+</text><text x="130" y="234" font-size="21" text-anchor="middle">−</text><text x="88" y="215" font-size="17" text-anchor="end">5 V</text><path d="M130 145V90H270 M330 90H440V135 M440 235V340H130V285 M440 110H610V180 M610 240V310H440" fill="none" stroke="#16324f" stroke-width="2.4"/><circle cx="300" cy="90" r="30" fill="white" stroke="#16324f" stroke-width="2"/><circle cx="610" cy="210" r="30" fill="white" stroke="#16324f" stroke-width="2"/><text x="300" y="97" font-size="22" text-anchor="middle">A</text><text x="610" y="217" font-size="22" text-anchor="middle">V</text><path d="M440 135v20 M440 215v20" fill="none" stroke="#16324f" stroke-width="2.4"/><rect x="430" y="155" width="20" height="60" fill="#eff8f8" stroke="#007f86" stroke-width="2"/><text x="440" y="191" font-size="18" text-anchor="middle"></text><text x="460" y="190" font-size="18" text-anchor="start">R = 1 kΩ</text><circle cx="440" cy="110" r="4" fill="#16324f"/><circle cx="440" cy="310" r="4" fill="#16324f"/><text x="270" y="390" font-size="18" text-anchor="start">A in serie; V in parallelo a R.</text><text x="24" y="430" font-size="18" text-anchor="start">Modello ideale: A legge 5 mA; V legge 5 V.</text></g></svg>