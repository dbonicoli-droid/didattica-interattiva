<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 510" role="img"><title>74LS85: confronto di due parole da 8 bit</title><rect width="720" height="510" rx="12" fill="white"/><g fill="#16324f" font-family="Arial,sans-serif"><text x="24" y="30" font-size="22" text-anchor="start">74LS85: confronto di due parole da 8 bit</text><rect x="95" y="130" width="200" height="240" fill="#eff8f8" stroke="#007f86" stroke-width="2"/><text x="195" y="256" font-size="18" text-anchor="middle">74LS85 basso</text><rect x="465" y="130" width="200" height="240" fill="#eff8f8" stroke="#007f86" stroke-width="2"/><text x="565" y="256" font-size="18" text-anchor="middle">74LS85 alto</text><text x="95" y="90" font-size="18" text-anchor="start">A[3:0], B[3:0]</text><text x="465" y="90" font-size="18" text-anchor="start">A[7:4], B[7:4]</text><path d="M195 100V130 M565 100V130" fill="none" stroke="#16324f" stroke-width="2.4"/><text x="24" y="405" font-size="18" text-anchor="start">Primo stadio: I(A=B)=1; I(A&gt;B)=I(A&lt;B)=0.</text><text x="24" y="440" font-size="18" text-anchor="start">Uso singolo: stessi ingressi di espansione; risultato sul primo stadio.</text><path d="M295 270H465" fill="none" stroke="#16324f" stroke-width="2.4"/><text x="380" y="262" font-size="16" text-anchor="middle">A &gt; B</text><path d="M295 305H465" fill="none" stroke="#16324f" stroke-width="2.4"/><text x="380" y="297" font-size="16" text-anchor="middle">A = B</text><path d="M295 340H465" fill="none" stroke="#16324f" stroke-width="2.4"/><text x="380" y="332" font-size="16" text-anchor="middle">A &lt; B</text><text x="495" y="200" font-size="18" text-anchor="start">Risultato finale</text><text x="24" y="480" font-size="18" text-anchor="start">Collegamenti logici di espansione; alimentazione e pin: vedere datasheet.</text></g></svg>