<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img"><title>Rete Ladder: StopOK AND (Start OR Run)</title><rect width="720" height="430" rx="12" fill="white"/><g fill="#16324f" font-family="Arial,sans-serif"><text x="24" y="30" font-size="22" text-anchor="start">Rete Ladder: StopOK AND (Start OR Run)</text><path d="M50 90V320 M670 90V320 M50 140H120 M180 140H290 M350 140H540 M620 140H670 M250 140V250H290 M350 250H450V140" fill="none" stroke="#16324f" stroke-width="2.4"/><path d="M120 140h20 M160 140h20 M140 126v28 M160 126v28" fill="none" stroke="#16324f" stroke-width="2.4"/><text x="150" y="115" font-size="16" text-anchor="middle">StopOK</text><path d="M290 140h20 M330 140h20 M310 126v28 M330 126v28" fill="none" stroke="#16324f" stroke-width="2.4"/><text x="320" y="115" font-size="16" text-anchor="middle">Start</text><path d="M290 250h20 M330 250h20 M310 236v28 M330 236v28" fill="none" stroke="#16324f" stroke-width="2.4"/><text x="320" y="225" font-size="16" text-anchor="middle">Run</text><path d="M540 140h10 M610 140h10" fill="none" stroke="#16324f" stroke-width="2.4"/><rect x="550" y="120" width="60" height="40" fill="#eff8f8" stroke="#007f86" stroke-width="2"/><text x="580" y="146" font-size="18" text-anchor="middle">Run</text><circle cx="250" cy="140" r="4" fill="#16324f"/><circle cx="450" cy="140" r="4" fill="#16324f"/><text x="24" y="370" font-size="18" text-anchor="start">I contatti verificano variabili: StopOK = 1 significa consenso presente.</text><text x="24" y="400" font-size="18" text-anchor="start">Run iniziale = 0. La rete assegna il nuovo valore di Run.</text></g></svg>