<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 455" role="img"><title>Luce comandata da tre punti: due deviatori e un invertitore</title><rect width="720" height="455" rx="12" fill="white"/><g fill="#16324f" font-family="Arial,sans-serif"><text x="24" y="30" font-size="22" text-anchor="start">Luce comandata da tre punti: due deviatori e un invertitore</text><path d="M45 160H110 M110 160L175 120 M175 120H285 M175 230H285 M435 120H530 M435 230H530 M530 120L595 160H625 M685 160H700V320H45" fill="none" stroke="#16324f" stroke-width="2.4"/><rect x="285" y="80" width="150" height="190" fill="#eff8f8" stroke="#007f86" stroke-width="2"/><text x="360" y="181" font-size="18" text-anchor="middle"></text><path d="M300 120L420 230 M300 230L420 120 M285 120H300 M285 230H300 M420 120H435 M420 230H435" fill="none" stroke="#16324f" stroke-width="2.4"/><circle cx="655" cy="160" r="30" fill="white" stroke="#16324f" stroke-width="2"/><path d="M634 139L676 181 M634 181L676 139" fill="none" stroke="#16324f" stroke-width="2.4"/><text x="40" y="140" font-size="16" text-anchor="start">+24 V</text><text x="40" y="350" font-size="16" text-anchor="start">0 V</text><text x="110" y="65" font-size="16" text-anchor="start">Deviatore A</text><text x="295" y="65" font-size="16" text-anchor="start">Invertitore</text><text x="530" y="65" font-size="16" text-anchor="start">Deviatore B</text><text x="24" y="395" font-size="18" text-anchor="start">Stato disegnato: vie incrociate, lampada spenta.</text><text x="24" y="425" font-size="18" text-anchor="start">L’altro stato dell’invertitore collega le vie diritte; incroci senza connessione.</text></g></svg>