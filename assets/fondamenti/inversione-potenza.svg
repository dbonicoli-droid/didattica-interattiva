<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 535" role="img"><title>Inversione: due configurazioni alternative</title><rect width="720" height="535" rx="12" fill="white"/><g fill="#16324f" font-family="Arial,sans-serif"><text x="24" y="30" font-size="22" text-anchor="start">Inversione: due configurazioni alternative</text><text x="80" y="95" font-size="16" text-anchor="middle">L1</text><path d="M80 110V145 M80 145l12 25 M80 175V210" fill="none" stroke="#16324f" stroke-width="2.4"/><text x="150" y="95" font-size="16" text-anchor="middle">L2</text><path d="M150 110V145 M150 145l12 25 M150 175V210" fill="none" stroke="#16324f" stroke-width="2.4"/><text x="220" y="95" font-size="16" text-anchor="middle">L3</text><path d="M220 110V145 M220 145l12 25 M220 175V210" fill="none" stroke="#16324f" stroke-width="2.4"/><text x="150" y="65" font-size="18" text-anchor="middle">KA: avanti</text><path d="M80 210L80 300V330" fill="none" stroke="#16324f" stroke-width="2.4"/><text x="80" y="360" font-size="18" text-anchor="middle">U</text><path d="M150 210L150 300V330" fill="none" stroke="#16324f" stroke-width="2.4"/><text x="150" y="360" font-size="18" text-anchor="middle">V</text><path d="M220 210L220 300V330" fill="none" stroke="#16324f" stroke-width="2.4"/><text x="220" y="360" font-size="18" text-anchor="middle">W</text><text x="150" y="395" font-size="16" text-anchor="middle">Morsetti dello stesso motore</text><text x="430" y="95" font-size="16" text-anchor="middle">L1</text><path d="M430 110V145 M430 145l12 25 M430 175V210" fill="none" stroke="#16324f" stroke-width="2.4"/><text x="500" y="95" font-size="16" text-anchor="middle">L2</text><path d="M500 110V145 M500 145l12 25 M500 175V210" fill="none" stroke="#16324f" stroke-width="2.4"/><text x="570" y="95" font-size="16" text-anchor="middle">L3</text><path d="M570 110V145 M570 145l12 25 M570 175V210" fill="none" stroke="#16324f" stroke-width="2.4"/><text x="500" y="65" font-size="18" text-anchor="middle">KB: indietro</text><path d="M430 210L570 300V330" fill="none" stroke="#16324f" stroke-width="2.4"/><text x="430" y="360" font-size="18" text-anchor="middle">U</text><path d="M500 210L500 300V330" fill="none" stroke="#16324f" stroke-width="2.4"/><text x="500" y="360" font-size="18" text-anchor="middle">V</text><path d="M570 210L430 300V330" fill="none" stroke="#16324f" stroke-width="2.4"/><text x="570" y="360" font-size="18" text-anchor="middle">W</text><text x="500" y="395" font-size="16" text-anchor="middle">Morsetti dello stesso motore</text><text x="24" y="440" font-size="18" text-anchor="start">Incroci senza punto = nessuna connessione. KB scambia L1 e L3.</text><text x="24" y="473" font-size="18" text-anchor="start">KA e KB: interblocco elettrico e meccanico; mai chiusi insieme.</text><text x="24" y="503" font-size="18" text-anchor="start">Protezioni a monte e PE al telaio come nello schema di avviamento.</text></g></svg>