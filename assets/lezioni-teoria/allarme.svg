<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 285" role="img" aria-labelledby="title"><title id="title">Allarme: OR dei due sensori e AND con il consenso</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="currentColor" stroke="none"/></marker></defs><style>path,rect,circle{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}text{fill:currentColor;stroke:none;font-family:system-ui,sans-serif}</style><text x="20" y="95" text-anchor="start" font-size="20">B · porta aperta</text><text x="20" y="175" text-anchor="start" font-size="20">C · finestra aperta</text><text x="370" y="40" text-anchor="start" font-size="20">A · allarme inserito</text><path d="M200 90L270 90"/><path d="M200 170L270 170"/><rect x="270" y="65" width="100" height="130"/><text x="320" y="140" text-anchor="middle" font-size="27">≥1</text><path d="M370 130L530 130"/><path d="M470 50L470 90"/><path d="M470 90L530 90"/><rect x="530" y="65" width="100" height="100"/><text x="580" y="125" text-anchor="middle" font-size="27">&amp;</text><path d="M630 115L760 115" marker-end="url(#arrow)"/><text x="760" y="100" text-anchor="middle" font-size="20">Y</text><text x="30" y="250" text-anchor="start" font-size="20">Y = A(B + C) · 1 = sirena comandata attiva</text></svg>