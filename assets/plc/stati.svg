ne</text><path d="M314 555L430 555"/><text x="30" y="662" text-anchor="start" font-size="19" stroke="none" fill="currentColor">5. Stop prevale sulle transizioni precedenti</text><path d="M30 688L30 780"/><rect x="430" y="682" width="310" height="112" rx="4"/><text x="585" y="707" text-anchor="middle" font-size="21" stroke="none" fill="currentColor">MOVE</text><text x="445" y="729" text-anchor="start" font-size="16" stroke="none" fill="currentColor">EN</text><text x="445" y="755" text-anchor="start" font-size="18" stroke="none" fill="currentColor">IN: 0</text><text x="445" y="781" text-anchor="start" font-size="18" stroke="none" fill="currentColor">OUT: ProssimoStato</text><path d="M30 710L220 710"/><path d="M220 694L220 726"/><path d="M252 694L252 726"/><text x="236" y="680" text-anchor="middle" font-size="19" stroke="none" fill="currentColor">Stop</text><path d="M252 710L430 710"/><text x="30" y="817" text-anchor="start" font-size="19" stroke="none" fill="currentColor">6. Aggiorna lo stato una sola volta</text><path d="M30 843L30 935"/><rect x="430" y="837" width="310" height="112" rx="4"/><text x="585" y="862" text-anchor="middle" font-size="21" stroke="none" fill="currentColor">MOVE</text><text x="445" y="884" text-anchor="start" font-size="16" stroke="none" fill="currentColor">EN</text><text x="445" y="910" text-anchor="start" font-size="18" stroke="none" fill="currentColor">IN: ProssimoStato</text><text x="445" y="936" text-anchor="start" font-size="18" stroke="none" fill="currentColor">OUT: Stato</text><path d="M30 865L430 865"/><text x="30" y="980" text-anchor="start" font-size="19" stroke="none" fill="currentColor">7. Uscita attiva solo nello stato 1</text><path d="M30 995L30 1075"/><path d="M750 995L750 1075"/><path d="M30 1030L90 1030"/><rect x="90" y="1010" width="165" height="40" rx="4"/><text x="172" y="1037" text-anchor="middle" font-size="19" stroke="none" fill="currentColor">Stato = 1</text><path d="M255 1030L558 1030"/><path d="M570 1013Q553 1030 57