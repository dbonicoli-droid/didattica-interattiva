<svg xmlns="http://www.w3.org/2000/svg" class="circuit-diagram" viewBox="0 0 520 330" role="img" aria-labelledby="circuit-title-2 circuit-desc-2">
<title id="circuit-title-2">Circuito 2: carica RC</title>
<desc id="circuit-desc-2">Generatore ideale a gradino da zero a 10 volt, resistore R₂ in serie al condensatore C₂. La tensione sul condensatore C₂ è misurata sul condensatore, positiva sulla piastra collegata al resistore. Il ritorno al generatore è il riferimento a zero volt.</desc>
