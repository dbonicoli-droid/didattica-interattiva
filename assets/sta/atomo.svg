<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img"><style>:root { --bg:#f6f8fc; --panel:#fff; --text:#172d43; --muted:#51667b; --border:#b7c5d6; --path:#b03c13; --lamp:#ffe37a; --lamp-edge:#796000; --focus:#007f91; --gap:.65rem; --radius:.8rem; --font:system-ui,sans-serif; --wire-width:3; --terminal-width:2; --diagram-font:21px; }/* Stile degli schemi statici; palette letta da tema-luci.scss. */
text{font:22px system-ui,sans-serif;fill:var(--text)}.small{font-size:18px}.title{font-size:26px;font-weight:700}.box{fill:var(--panel);stroke:var(--border);stroke-width:2}.wire{fill:none;stroke:var(--text);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.phase{stroke:var(--path)}.neutral{stroke:var(--focus)}.terminal{fill:var(--panel);stroke:var(--text);stroke-width:2}.junction{fill:var(--text)}.dash{stroke-dasharray:7 5}

:root { --guide-pe:#287f38; }
.pe { stroke:var(--guide-pe); }.cross-clear { fill:none; stroke:var(--panel); stroke-width:12; }
</style><rect width="1000" height="420" fill="var(--panel)"/><text x="30" y="40" class="title">Atomo neutro di elio · rappresentazione schematica</text><ellipse cx="310" cy="225" rx="200" ry="140" fill="var(--bg)" stroke="var(--border)" stroke-dasharray="6 5"/><circle cx="285" cy="200" r="27" fill="var(--panel)" stroke="var(--text)"/><text x="275" y="208" class="">+</text><circle cx="335" cy="200" r="27" fill="var(--panel)" stroke="var(--text)"/><text x="325" y="208" class="">n</text><circle cx="285" cy="250" r="27" fill="var(--panel)" stroke="var(--text)"/><text x="275" y="258" class="">n</text><circle cx="335" cy="250" r="27" fill="var(--panel)" stroke="var(--text)"/><text x="325" y="258" class="">+</text><circle cx="165" cy="155" r="18" fill="var(--focus)"/><text x="157" y="162" class="">−</text><circle cx="450" cy="290" r="18" fill="var(--focus)"/><text x="442" y="297" class="">−</text><text x="550" y="135" class="">Nucleo: 2 protoni (+)</text><text x="550" y="170" class="">e 2 neutroni (n)</text><text x="550" y="230" class="">Regione degli elettroni:</text><text x="550" y="265" class="">2 elettroni (−)</text><text x="550" y="330" class="">Carica totale: zero</text><text x="30" y="395" class="small">Dimensioni e posizioni semplificate; non sono rappresentate orbite.</text></svg>