<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img"><style>:root { --bg:#f6f8fc; --panel:#fff; --text:#172d43; --muted:#51667b; --border:#b7c5d6; --path:#b03c13; --lamp:#ffe37a; --lamp-edge:#796000; --focus:#007f91; --gap:.65rem; --radius:.8rem; --font:system-ui,sans-serif; --wire-width:3; --terminal-width:2; --diagram-font:21px; }/* Stile degli schemi statici; palette letta da tema-luci.scss. */
text{font:22px system-ui,sans-serif;fill:var(--text)}.small{font-size:18px}.title{font-size:26px;font-weight:700}.box{fill:var(--panel);stroke:var(--border);stroke-width:2}.wire{fill:none;stroke:var(--text);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.phase{stroke:var(--path)}.neutral{stroke:var(--focus)}.terminal{fill:var(--panel);stroke:var(--text);stroke-width:2}.junction{fill:var(--text)}.dash{stroke-dasharray:7 5}

:root { --guide-pe:#287f38; }
.pe { stroke:var(--guide-pe); }.cross-clear { fill:none; stroke:var(--panel); stroke-width:12; }
</style><rect width="1000" height="420" fill="var(--panel)"/><text x="30" y="45" class="title">Il filo: due materiali con funzioni diverse</text><rect x="100" y="130" width="650" height="110" rx="40" fill="var(--bg)" stroke="var(--focus)" stroke-width="12"/><rect x="100" y="168" width="770" height="34" rx="12" fill="var(--path)"/><text x="180" y="100" class="">Guaina isolante (plastica)</text><path class="wire neutral" d="M350 108V130"/><text x="560" y="295" class="">Anima conduttrice (rame)</text><path class="wire phase" d="M790 275V205"/><text x="30" y="365" class="small">Il metallo trasporta corrente; la guaina protegge dal contatto.</text></svg>