<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img"><style>:root { --bg:#f6f8fc; --panel:#fff; --text:#172d43; --muted:#51667b; --border:#b7c5d6; --path:#b03c13; --lamp:#ffe37a; --lamp-edge:#796000; --focus:#007f91; --gap:.65rem; --radius:.8rem; --font:system-ui,sans-serif; --wire-width:3; --terminal-width:2; --diagram-font:21px; }/* Stile degli schemi statici; palette letta da tema-luci.scss. */
text{font:22px system-ui,sans-serif;fill:var(--text)}.small{font-size:18px}.title{font-size:26px;font-weight:700}.box{fill:var(--panel);stroke:var(--border);stroke-width:2}.wire{fill:none;stroke:var(--text);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.phase{stroke:var(--path)}.neutral{stroke:var(--focus)}.terminal{fill:var(--panel);stroke:var(--text);stroke-width:2}.junction{fill:var(--text)}.dash{stroke-dasharray:7 5}

:root { --guide-pe:#287f38; }
.pe { stroke:var(--guide-pe); }.cross-clear { fill:none; stroke:var(--panel); stroke-width:12; }
</style><rect width="1000" height="420" fill="var(--panel)"/><text x="30" y="40" class="title">Due versi opposti nel metallo</text><rect class="box" x="100" y="160" width="800" height="100" rx="18"/><circle cx="220" cy="210" r="17" fill="var(--focus)"/><text x="212" y="217" class="">−</text><circle cx="360" cy="210" r="17" fill="var(--focus)"/><text x="352" y="217" class="">−</text><circle cx="500" cy="210" r="17" fill="var(--focus)"/><text x="492" y="217" class="">−</text><circle cx="640" cy="210" r="17" fill="var(--focus)"/><text x="632" y="217" class="">−</text><circle cx="780" cy="210" r="17" fill="var(--focus)"/><text x="772" y="217" class="">−</text><path class="wire phase" d="M180 115H820l-20 -12 m20 12l-20 12"/><text x="180" y="92" class="">Campo elettrico e corrente convenzionale →</text><path class="wire neutral" d="M820 305H180l20 -12 m-20 12l20 12"/><text x="180" y="350" class="">← Moto medio degli elettroni</text><text x="30" y="400" class="small">Le frecce indicano versi medi, non le traiettorie dei singoli elettroni.</text></svg>