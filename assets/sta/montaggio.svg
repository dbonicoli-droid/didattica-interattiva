<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 630" role="img" aria-label="Schema di montaggio di lampada interrotta e presa"><style>:root { --bg:#f6f8fc; --panel:#fff; --text:#172d43; --muted:#51667b; --border:#b7c5d6; --path:#b03c13; --lamp:#ffe37a; --lamp-edge:#796000; --focus:#007f91; --gap:.65rem; --radius:.8rem; --font:system-ui,sans-serif; --wire-width:3; --terminal-width:2; --diagram-font:21px; }/* Stile degli schemi statici; palette letta da tema-luci.scss. */
text{font:22px system-ui,sans-serif;fill:var(--text)}.small{font-size:18px}.title{font-size:26px;font-weight:700}.box{fill:var(--panel);stroke:var(--border);stroke-width:2}.wire{fill:none;stroke:var(--text);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.phase{stroke:var(--path)}.neutral{stroke:var(--focus)}.terminal{fill:var(--panel);stroke:var(--text);stroke-width:2}.junction{fill:var(--text)}.dash{stroke-dasharray:7 5}

:root { --guide-pe:#287f38; }
.pe { stroke:var(--guide-pe); }.cross-clear { fill:none; stroke:var(--panel); stroke-width:12; }
</style><text x="30" y="45" class="title" text-anchor="start">Schema di montaggio · Collegamenti ai morsetti</text><rect class="box" x="145" y="185" width="175" height="175" rx="10"/><rect class="box" x="445" y="170" width="210" height="235" rx="10"/><rect class="box" x="785" y="170" width="255" height="235" rx="10"/><text x="232" y="220" class="" text-anchor="middle">S1</text><text x="550" y="208" class="" text-anchor="middle">L1 · classe I</text><text x="912" y="208" class="" text-anchor="middle">X1 · Presa</text><path class="wire phase" d="M55 95H1080"/><path class="wire neutral" d="M55 480H1080"/><path class="wire pe" d="M55 540H1080"/><text x="25" y="102" class="" text-anchor="start">L</text><text x="25" y="487" class="" text-anchor="start">N</text><text x="15" y="547" class="" text-anchor="start">PE</text><path class="wire phase" d="M190 95V245 M265 315H380V245H480 M830 95V245"/><path class="wire neutral" d="M540 315V480 M900 315V480"/><path class="cross-clear" d="M600 375V540 M980 375V540"/><path class="wire pe" d="M600 375V540 M980 375V540"/><circle class="terminal" cx="190" cy="245" r="5"/><text x="202" y="233" class="small" text-anchor="start">1</text><circle class="terminal" cx="265" cy="315" r="5"/><text x="277" y="303" class="small" text-anchor="start">2</text><circle class="terminal" cx="480" cy="245" r="5"/><text x="492" y="233" class="small" text-anchor="start">L</text><circle class="terminal" cx="540" cy="315" r="5"/><text x="552" y="303" class="small" text-anchor="start">N</text><circle class="terminal" cx="600" cy="375" r="5"/><text x="612" y="363" class="small" text-anchor="start">PE</text><circle class="terminal" cx="830" cy="245" r="5"/><text x="842" y="233" class="small" text-anchor="start">L</text><circle class="terminal" cx="900" cy="315" r="5"/><text x="912" y="303" class="small" text-anchor="start">N</text><circle class="terminal" cx="980" cy="375" r="5"/><text x="992" y="363" class="small" text-anchor="start">PE</text><circle class="junct