<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 600" role="img" aria-label="Schema elettrico punto luce interrotto e presa"><style>:root { --bg:#f6f8fc; --panel:#fff; --text:#172d43; --muted:#51667b; --border:#b7c5d6; --path:#b03c13; --lamp:#ffe37a; --lamp-edge:#796000; --focus:#007f91; --gap:.65rem; --radius:.8rem; --font:system-ui,sans-serif; --wire-width:3; --terminal-width:2; --diagram-font:21px; }/* Stile degli schemi statici; palette letta da tema-luci.scss. */
