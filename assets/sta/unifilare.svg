<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 570" role="img" aria-label="Schema unifilare di lampada interrotta e presa"><style>:root { --bg:#f6f8fc; --panel:#fff; --text:#172d43; --muted:#51667b; --border:#b7c5d6; --path:#b03c13; --lamp:#ffe37a; --lamp-edge:#796000; --focus:#007f91; --gap:.65rem; --radius:.8rem; --font:system-ui,sans-serif; --wire-width:3; --terminal-width:2; --diagram-font:21px; }/* Stile degli schemi statici; palette letta da tema-luci.scss. */
text{font:22px system-ui,sans-serif;fill:var(--text)}.small{font-size:18px}.title{font-size:26px;font-weight:700}.box{fill:var(--panel);stroke:var(--border);stroke-width:2}.wire{fill:none;stroke:var(--text);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.phase{stroke:var(--path)}.neutral{stroke:var(--focus)}.terminal{fill:var(--panel);stroke:var(--text);stroke-width:2}.junction{fill:var(--text)}.dash{stroke-dasharray:7 5}

:root { --guide-pe:#287f38; }
.pe { stroke:var(--guide-pe); }.cross-clear { fill:none; stroke:var(--panel); stroke-width:12; }
</style><text x="30" y="45" class="title" text-anchor="start">Schema unifilare · Percorsi e conduttori</text><rect class="box" x="145" y="115" width="860" height="85" rx="10"/><text x="575" y="166" class="" text-anchor="middle">J1 · Derivazione</text><path class="wire " d="M40 157H145"/><path class="wire " d="M85 143l-12 28"/><text x="30" y="100" class="" text-anchor="start">L, N, PE</text><text x="95" y="183" class="" text-anchor="start">3</text><path class="wire " d="M300 200V330"/><path class="wire " d="M290 260l20 -20"/><text x="320" y="260" class="" text-anchor="start">2</text><rect class="box" x="200" y="330" width="200" height="100" rx="10"/><text x="300" y="369" class="" text-anchor="middle">S1</text><text x="300" y="403" class="small" text-anchor="middle">Interruttore</text><path class="wire " d="M575 200V330"/><path class="wire " d="M565 260l20 -20"/><text x="595" y="260" class="" text-anchor="start">3</text><rect class="box" x="475" y="330" width="200" height="100" rx="10"/><text x="575" y="369" class="" text-anchor="middle">L1</text><text x="575" y="403" class="small" text-anchor="middle">Lampada classe I</text><path class="wire " d="M850 200V330"/><path class="wire " d="M840 260l20 -20"/><text x="870" y="260" class="" text-anchor="start">3</text><rect class="box" x="750" y="330" width="200" height="100" rx="10"/><text x="850" y="369" class="" text-anchor="middle">X1</text><text x="850" y="403" class="small" text-anchor="middle">Presa</text><text x="30" y="495" class="small" text-anchor="start">S1: fase + ritorno comandato. L1: ritorno + N + PE. X1: L + N + PE.</text><text x="30" y="533" class="small" text-anchor="start">Una linea rappresenta il percorso di più conduttori; il numero ne indica la quantità.</text></svg>