<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 365" role="img" aria-label="Due deviatori e un invertitore: lampada accesa"><style>/* CSS puro: incorporato dal generatore negli HTML autonomi. */
:root { --bg:#f6f8fc; --panel:#fff; --text:#172d43; --muted:#51667b; --border:#b7c5d6; --path:#b03c13; --lamp:#ffe37a; --lamp-edge:#796000; --focus:#007f91; --gap:.65rem; --radius:.8rem; --font:system-ui,sans-serif; --wire-width:3; --terminal-width:2; --diagram-font:21px; }

* { box-sizing:border-box; }body { margin:0; background:var(--bg); color:var(--text); font-family:var(--font); }
main { max-width:1400px; margin:auto; padding:.8rem; }h1 { font-size:1.25rem; margin:.2rem 0 .5rem; }p { margin:.35rem 0; line-height:1.5; }
button { font:inherit; color:var(--text); background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:.5rem .7rem; cursor:pointer; }button:hover { border-color:var(--focus); }button:disabled { opacity:.55; cursor:wait; }:focus-visible { outline:3px solid var(--focus); outline-offset:3px; }
.toolbar,.actions,.states { display:flex; flex-wrap:wrap; gap:var(--gap); align-items:center; }.toolbar { justify-content:space-between; margin-bottom:.7rem; }.toolbar div { display:flex; flex-wrap:wrap; gap:.4rem; }
.canvas { overflow:auto; background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); }svg { display:block; width:100%; min-width:0; height:auto; max-height:500px; }svg text { fill:var(--text); font:var(--diagram-font) var(--font); }svg .supply { font-weight:700; }
.wire { fill:none; stroke:var(--text); stroke-width:var(--wire-width); stroke-linecap:round; stroke-linejoin:round; }.wire.active { stroke:var(--path); stroke-width:4; }
.terminal { fill:var(--panel); stroke:var(--text); stroke-width:var(--terminal-width); }.junction { fill:var(--text); }.cross-clear { fill:none; stroke:var(--panel); stroke-width:13; }
.device-box { fill:none; stroke:var(--border); stroke-width:2; stroke-dasharray:8 6; }.actuator { fill:none; stroke:var(--text); stroke-width:2; }.mechanism { fill:none; stroke:var(--muted); stroke-width:2; stroke-dasharray:7 6; }
.bulb,.coil { fill:var(--panel); stroke:var(--text); stroke-width:3; }.bulb.lit { fill:var(--lamp); stroke:var(--lamp-edge); }.bulb.lit + path { stroke:var(--lamp-edge); }.coil.energized { stroke:var(--path); stroke-width:4; }svg .active-text { fill:var(--path); }
.status { padding:.6rem .75rem; border:1px solid var(--border); border-radius:var(--radius); background:var(--panel); margin:.65rem 0; font-weight:650; }.status strong { padding:.1rem .3rem; }.status[data-on=true] strong { color:var(--lamp-edge); background:var(--lamp); }
.states { font-size:.9rem; color:var(--muted); margin:.5rem 0; }.actions button { flex:1 1 180px; min-height:44px; }.hint { color:var(--muted); font-size:.85rem; margin:.6rem 0; }details { margin:.6rem 0; }summary { cursor:pointer; font-weight:600; }details p { font-size:.9rem; }
main:fullscreen,.expanded { width:100%; height:100dvh; max-width:none; overflow:auto; background:var(--bg); padding:1rem; }.expanded { position:fixed; inset:0; z-index:20; }body.open { overflow:hidden; }
@media(max-width:600px) { svg { min-width:760px; } main { padding:.5rem; }.actions { gap:.4rem; }.actions button { flex-basis:100%; }.toolbar { gap:.5rem; }h1 { font-size:1.05rem; } }
@media print { .toolbar,.actions { display:none; }svg { min-width:0; }.canvas { overflow:visible; } }
