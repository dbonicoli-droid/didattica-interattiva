</style><text x="30" y="45" class="title" text-anchor="start">Unifilare · Pulsanti e relè</text><rect class="box" x="135" y="110" width="880" height="90" rx="10"/><text x="575" y="165" class="" text-anchor="middle">J1 · Derivazione con relè K1</text><path class="wire " d="M35 155H135"/><path class="wire " d="M80 142l-12 26"/><text x="30" y="100" class="" text-anchor="start">L, N</text><text x="83" y="185" class="" text-anchor="start">2</text><path class="wire " d="M230 200V330"/><path class="wire " d="M221 256l18 -20"/><text x="248" y="255" class="" text-anchor="start">2</text><rect class="box" x="155" y="330" width="150" height="95" rx="10"/><text x="230" y="365" class="" text-anchor="middle">S1</text><text x="230" y="395" class="small" text-anchor="middle">Pulsante NO</text><path class="wire " d="M460 200V330"/><path class="wire " d="M451 256l18 -20"/><text x="478" y="255" class="" text-anchor="start">2</text><rect class="box" x="385" y="330" width="150" height="95" rx="10"/><text x="460" y="365" class="" text-anchor="middle">S2</text><text x="460" y="395" class="small" text-anchor="middle">Pulsante NO</text><path class="wire " d="M690 200V330"/><path class="wire " d="M681 256l18 -20"/><text x="708" y="255" class="" text-anchor="start">2</text><rect class="box" x="615" y="330" width="150" height="95" rx="10"/><text x="690" y="365" class="" text-anchor="middle">S3</text><text x="690" y="395" class="small" text-anchor="middle">Pulsante NO</text><path class="wire " d="M920 200V330"/><path class="wire " d="M911 256l18 -20"/><text x="938" y="255" class="" text-anchor="start">2</text><rect class="box" x="845" y="330" width="150" height="95" rx="10"/><text x="920" y="365" class="" text-anchor="middle">L1</text><text x="920" y="395" class="small" text-anchor="middle">Lampada</text><text x="35" y="475" class="small" text-anchor="start">Una linea = un percorso con più conduttori. Numero = conduttori funzionali.</text><text x="35" y="508" class="small" text-anchor="start">Gli schemi di montaggio sotto mostrano come collegare i singoli morsetti.</text></svg>