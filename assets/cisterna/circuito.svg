<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" role="img" aria-label="Generatore 5 volt, interruttore di carica S R, resistenza R R, condensatore C, resistenza di scarica R P e interruttore S P con ritorno comune"><style>/* CSS puro per la web app autonoma; colori definiti in questo tema. */
:root{--bg:#f5f8fc;--panel:#fff;--text:#19324c;--muted:#52697f;--border:#bfcede;--accent:#007c91;--fill:#1587b5;--threshold:#a94815;--grid:#d6e1ec;--radius:.8rem;--gap:.7rem;--font:system-ui,sans-serif}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px var(--font)}main{max-width:1400px;margin:auto;padding:.7rem}h1{font-size:1.2rem;margin:0}button,input{font:inherit}button{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:.5rem;padding:.45rem .7rem;min-height:40px;cursor:pointer}button[aria-pressed=true]{border:2px solid var(--accent);background:var(--bg)}button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}.toolbar,.switches,.readings,.parameters,.initial{display:flex;align-items:center;gap:var(--gap);flex-wrap:wrap}.toolbar{justify-content:space-between;margin-bottom:.6rem}.toolbar>div{display:flex;gap:.4rem;flex-wrap:wrap}.switches button{flex:1}.switches{margin:.6rem 0}.visuals{display:grid;grid-template-columns:minmax(0,4fr) minmax(150px,1fr);gap:var(--gap)}.panel{border:1px solid var(--border);background:var(--panel);border-radius:var(--radius);padding:.5rem}.diagram svg{width:100%;height:auto;display:block}svg text{font:20px var(--font);fill:var(--text)}.wire{stroke:var(--text);stroke-width:3;fill:none;stroke-linejoin:round;stroke-linecap:round}.terminal{fill:var(--panel);stroke:var(--text);stroke-width:2}.junction{fill:var(--text)}.arrow{stroke:var(--accent);stroke-width:2}.charge{stroke:var(--accent)}.tank{position:relative;width:90px;height:150px;border:3px solid var(--text);border-top:0;margin:.7rem auto 1.7rem;overflow:visible}.water{position:absolute;bottom:0;left:0;right:0;background:var(--fill)}.threshold{position:absolute;left:-8px;right:-8px;border-top:2px dashed var(--threshold)}.low{bottom:10%}.high{bottom:90%}.tank-reading{text-align:center;font-size:1.25rem;font-weight:700}.tank-label{text-align:center;font-size:.85rem;color:var(--muted)}.readings{justify-content:space-between;font-variant-numeric:tabular-nums;font-size:.95rem;padding:.5rem 0}.chart{height:220px}canvas{width:100%;height:100%;display:block}.parameters{margin-top:.6rem;align-items:stretch}.parameters label{flex:1 1 160px;min-width:0;padding:.5rem;border:1px solid var(--border);border-radius:.5rem}.parameters input{display:block;width:100%;accent-color:var(--accent)}input[type=number]{color:var(--text);background:var(--panel);border:1px solid var(--border);border-radius:.3rem;padding:.25rem;max-width:110px}.initial{margin-top:.5rem;font-size:.9rem}.initial input{max-width:80px}.note{font-size:.85rem;color:var(--muted);margin:.5rem 0}.expanded,main:fullscreen{background:var(--bg);max-width:none;width:100%;height:100dvh;overflow:auto}.expanded{position:fixed;inset:0;z-index:100}body.open{overflow:hidden}@media(max-width:650px){.visuals{grid-template-columns:1fr}.tank-panel{display:flex;align-items:center;justify-content:space-evenly}.tank{height:100px;width:70px;margin:0 .5rem}.diagram{overflow:auto}.diagram svg{min-width:700px}.chart{height:200px}.parameters label{flex-basis:140px}.readings{justify-content:flex-start}.toolbar h1{font-size:1rem}}
.diagram svg{max-height:285px}
</style><rect width="900" height="310" fill="var(--panel)"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="currentColor"/></marker></defs><path class="wire " d="M80 100V155 M80 191V260H820V100 M80 100H132"/><circle class="wire" cx="80" cy="173" r="18"/><text x="72" y="169">+</text><text x="73" y="186">−</text><text x="15" y="225">5 V</text><path class="wire " d="M132 100H160 M208 100H234"/><circle class="terminal" cx="160" cy="100" r="4"/><circle class="terminal" cx="208" cy="100" r="4"/><path class="wire " d="M160 100L202 75"/><text x="157" y="55">S<tspan baseline-shift="sub" font-size="75%">R</tspan></text><text x="157" y="137">aperto</text><path class="wire " d="M234 100H260 M310 100H560 M610 100H672 M774 100H820"/><rect class="wire" x="260" y="91" width="50" height="18"/><text x="252" y="55">R<tspan baseline-shift="sub" font-size="75%">R</tspan></text><text x="240" y="160">110 kΩ</text><rect class="wire" x="560" y="91" width="50" height="18"/><text x="552" y="55">R<tspan baseline-shift="sub" font-size="75%">P</tspan></text><text x="545" y="160">110 kΩ</text><path class="wire " d="M672 100H700 M748 100H774"/><circle class="terminal" cx="700" cy="100" r="4"/><circle class="terminal" cx="748" cy="100" r="4"/><path class="wire " d="M700 100L742 75"/><text x="697" y="55">S<tspan baseline-shift="sub" font-size="75%">P</tspan></text><text x="697" y="137">aperto</text><path class="wire " d="M430 100V174 M400 174H460 M400 190H460 M430 190V260"/><circle class="junction" cx="430" cy="100" r="4"/><circle class="junction" cx="430" cy="260" r="4"/><text x="380" y="163">+</text><text x="380" y="215">−</text><text x="475" y="202">C</text><text x="475" y="232">47 µF</text><text x="350" y="300">0 V · riferimento comune</text><path class="wire arrow" d="M345 78H395 M640 78H681"/><text x="355" y="60">i<tspan baseline-shift="sub" font-size="75%">R</tspan> →</text><text x="635" y="60">i<tspan baseline-shift="sub" font-size="75%">P</tspan> →</text><text x="286" y="225">v<tspan baseline-shift="sub" font-size="75%">C</tspan> = 0 V</text></svg>